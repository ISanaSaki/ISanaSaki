<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 664" width="800" height="664" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Backend Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A9B8CF"/>
    </marker>
  </defs>

  <rect width="800" height="664" rx="16" fill="#0B132B"/>

  <!-- Client -> Nginx -->
  <rect x="70" y="20" width="160" height="44" rx="22" fill="#1C2541" stroke="#3A506B" stroke-width="1.5"/>
  <text x="150" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Client</text>

  <line x1="150" y1="64" x2="150" y2="98" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="162" y="86" font-size="11" fill="#A9B8CF">HTTPS</text>

  <rect x="70" y="100" width="160" height="54" rx="10" fill="#1C2541" stroke="#3A506B" stroke-width="1.5"/>
  <text x="150" y="124" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Nginx</text>
  <text x="150" y="142" text-anchor="middle" font-size="11" fill="#A9B8CF">Reverse Proxy</text>

  <!-- FastAPI service group -->
  <rect x="40" y="196" width="720" height="204" rx="14" fill="#101936" stroke="#3A506B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="218" text-anchor="end" font-size="12" font-weight="600" fill="#A9B8CF">FastAPI Service</text>

  <line x1="150" y1="154" x2="150" y2="304" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="320" y="226" width="160" height="52" rx="10" fill="#1C2541" stroke="#3A506B" stroke-width="1.5"/>
  <text x="400" y="249" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">ML Inference</text>
  <text x="400" y="267" text-anchor="middle" font-size="11" fill="#A9B8CF">scikit-learn</text>

  <rect x="70" y="306" width="160" height="64" rx="10" fill="#1C2541" stroke="#3A506B" stroke-width="1.5"/>
  <text x="150" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Routers</text>
  <text x="150" y="352" text-anchor="middle" font-size="11" fill="#A9B8CF">Auth and RBAC</text>

  <rect x="320" y="306" width="160" height="64" rx="10" fill="#1C2541" stroke="#3A506B" stroke-width="1.5"/>
  <text x="400" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Service Layer</text>
  <text x="400" y="352" text-anchor="middle" font-size="11" fill="#A9B8CF">Business Logic</text>

  <rect x="570" y="306" width="160" height="64" rx="10" fill="#1C2541" stroke="#3A506B" stroke-width="1.5"/>
  <text x="650" y="333" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Repository Layer</text>
  <text x="650" y="352" text-anchor="middle" font-size="11" fill="#A9B8CF">SQLAlchemy</text>

  <line x1="230" y1="338" x2="318" y2="338" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="338" x2="568" y2="338" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="306" x2="400" y2="280" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data and async group -->
  <rect x="40" y="450" width="720" height="170" rx="14" fill="#101936" stroke="#3A506B" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="740" y="472" text-anchor="end" font-size="12" font-weight="600" fill="#A9B8CF">Data and Async Layer</text>

  <rect x="70" y="510" width="160" height="64" rx="10" fill="#1C2541" stroke="#7C9CC4" stroke-width="1.5"/>
  <text x="150" y="537" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Celery Workers</text>
  <text x="150" y="556" text-anchor="middle" font-size="11" fill="#A9B8CF">Background Tasks</text>

  <rect x="320" y="510" width="160" height="64" rx="10" fill="#1C2541" stroke="#7C9CC4" stroke-width="1.5"/>
  <text x="400" y="537" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Redis</text>
  <text x="400" y="556" text-anchor="middle" font-size="11" fill="#A9B8CF">Cache and Broker</text>

  <rect x="570" y="510" width="160" height="64" rx="10" fill="#1C2541" stroke="#7C9CC4" stroke-width="1.5"/>
  <text x="650" y="537" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">PostgreSQL</text>
  <text x="650" y="556" text-anchor="middle" font-size="11" fill="#A9B8CF">Relational Database</text>

  <!-- Service -> Redis -->
  <line x1="400" y1="370" x2="400" y2="508" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="412" y="432" font-size="11" fill="#A9B8CF">cache / enqueue</text>

  <!-- Redis -> Workers -->
  <line x1="320" y1="542" x2="232" y2="542" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="276" y="534" text-anchor="middle" font-size="10" fill="#A9B8CF">consume tasks</text>

  <!-- Repository -> PostgreSQL -->
  <line x1="650" y1="370" x2="650" y2="508" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Workers -> PostgreSQL -->
  <path d="M150 574 L150 600 L650 600 L650 576" fill="none" stroke="#A9B8CF" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="400" y="648" text-anchor="middle" font-size="12" fill="#A9B8CF">Containerized with Docker · Served behind Nginx</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
